<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Günümə Dəvətlisən!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1a1a1a;
            border: 2px dashed #444;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #aaaaaa;
            font-style: italic;
            margin-bottom: 20px;
        }

        .popkek-badge {
            background-color: #ffd60a;
            color: #000000;
            font-weight: 800;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Photo Section */
        .photo-container {
            width: 100%;
            height: 220px;
            background-color: #2a2a2a;
            border: 2px dashed #555;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Şəkil əlavə edildikdə JavaScript vasitəsilə görünə bilər */
        }

        .photo-placeholder-text {
            color: #888888;
            font-size: 14px;
        }

        .photo-placeholder-icon {
            font-size: 32px;
            margin-bottom: 8px;
            color: #666;
        }

        /* Event Details */
        .info-card {
            background-color: #222222;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            border: 1px solid #333;
        }

        .info-item {
            text-align: center;
        }

        .info-item .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-item .value {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Map Section */
        .map-section {
            margin-top: 10px;
            text-align: left;
        }

        .map-section h3 {
            font-size: 14px;
            color: #aaaaaa;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
        }

        .map-container {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">XAHİŞ EDİRƏM<br>AD GÜNÜMƏ GƏL</div>
    <div class="subtitle">O qədər təkəm ki, poster yapışdırıb sayt yaratdım...</div>
    
    <div class="popkek-badge">🎂 GƏLƏNLƏRƏ PULSUZ POPKEK! 🧁</div>

    <!-- Şəkil Yeri -->
    <div class="photo-container">
        <!-- Şəkil yerləşdirmək üçün aşağıdakı <img> teqinin 'src' hissəsinə şəklinizin linkini yaza bilərsiniz -->
        <img src="" alt="Ad günü şəkli" id="birthday-img">
        <div class="photo-placeholder-icon">📷</div>
        <div class="photo-placeholder-text">Buraya şəkil yerləşdirə bilərsiniz<br><small>(HTML içində &lt;img src="..."&gt; hissəsinə link qoyun)</small></div>
    </div>

    <!-- Tarix və Saat -->
    <div class="info-card">
        <div class="info-item">
            <div class="label">📅 Tarix</div>
            <div class="value">25 Sentyabr</div>
        </div>
        <div class="info-item">
            <div class="label">⏰ Saat</div>
            <div class="value">18:00</div>
        </div>
    </div>

    <!-- Google Maps Konum -->
    <div class="map-section">
        <h3>📍 Məkan / Konum</h3>
        <div class="map-container">
            <!-- Bakı Fəvvarələr Meydanı (Nümunə konum). Öz dəqiq məkanınızın iframe kodunu bura qoya bilərsiniz -->
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3039.428612282218!2d49.8344!3d40.3701!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40307d079efb5163%3A0x82f9d5015e1284d0!2sFountain%20Square!5e0!3m2!1sen!2saz!4v1690000000000!5m2!1sen!2saz" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </div>

    <div class="footer-note">Gələcəksənsə dostlarını da gətirə bilərsən! :)</div>
</div>

</body>
</html>
